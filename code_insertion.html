<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Python Module Visualizer & Responsive IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');

/* ---------- Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid #1e293b; }
button, input, textarea { font: inherit; color: inherit; background: none; }
button { cursor: pointer; }
:root {
  --slate-950:#020617; --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155;
  --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1;
  --slate-200:#e2e8f0; --slate-100:#f1f5f9;
  --emerald-300:#6ee7b7; --emerald-400:#34d399; --emerald-500:#10b981; --emerald-600:#059669;
  --blue-300:#93c5fd; --blue-400:#60a5fa; --blue-500:#3b82f6; --blue-600:#2563eb;
  --rose-400:#fb7185; --yellow-400:#facc15; --red-400:#f87171;
}
body {
  font-family: 'Inter', sans-serif;
  background-color: #090d16;
  color: var(--slate-200);
  -webkit-tap-highlight-color: transparent;
  height: 100vh; width: 100vw;
  display: flex; flex-direction: column; overflow: hidden;
}
code, pre, textarea, .font-mono { font-family: 'Fira Code', monospace; }
.hidden { display: none !important; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--slate-900); }
::-webkit-scrollbar-thumb { background: var(--slate-700); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--slate-600); }
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

/* ---------- Header ---------- */
.app-header {
  background: var(--slate-900); border-bottom-width: 1px;
  padding: .625rem .75rem; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; z-index: 20;
}
.header-left, .header-actions { display: flex; align-items: center; gap: .5rem; }
.app-title { font-size: .75rem; font-weight: 700; color: var(--slate-100); letter-spacing: .025em; display: flex; align-items: center; gap: .375rem; }
.icon-btn {
  display: flex; align-items: center; justify-content: center; gap: .375rem;
  width: 2.5rem; height: 2.5rem; border-radius: .5rem;
  background: var(--slate-800); color: var(--slate-300); font-size: .75rem; font-weight: 500;
  border: 1px solid rgba(51,65,85,.6); transition: all .15s;
}
.icon-btn:hover { background: var(--slate-700); }
.icon-btn:active { transform: scale(.95); }
.icon-btn.danger { color: var(--rose-400); }
.menu-btn { border: 0; }
.btn-label { display: none; }

/* ---------- Layout ---------- */
#mainContainer { flex: 1 1 0%; display: flex; flex-direction: column; overflow: scroll; position: relative; }
#editorPanel {
  flex: 1 1 0%; display: flex; flex-direction: column; background: var(--slate-900);
  border-right-width: 1px; min-width: 0; width: 100%; height: 100%;
}
.tabs-bar {
  display: none; background: rgba(2,6,23,.9); border-bottom-width: 1px;
  overflow-x: auto; align-items: center; padding-right: .5rem; flex-shrink: 0;
}
#tabsContainer { display: flex; align-items: center; }
.add-tab-btn { margin-left: .5rem; color: var(--slate-500); padding: .625rem; font-size: .75rem; min-width: 36px; transition: color .15s; }
.add-tab-btn:hover { color: var(--emerald-400); }

.tab-btn {
  padding: .625rem .875rem; font-size: .75rem; font-family: 'Fira Code', monospace;
  display: flex; align-items: center; gap: .5rem; border-right-width: 1px;
  transition: all .15s; min-height: 42px; color: var(--slate-400);
}
.tab-btn:hover { background: rgba(15,23,42,.6); }
.tab-btn.active { background: var(--slate-900); color: var(--slate-100); border-top: 2px solid var(--blue-500); font-weight: 600; }
.ico-heart { color: var(--red-400); }
.ico-hand { color: var(--yellow-400); }
.ico-default { color: var(--blue-400); }

.mobile-file-bar {
  display: flex; background: var(--slate-950); padding: .5rem .75rem; border-bottom-width: 1px;
  justify-content: space-between; align-items: center; flex-shrink: 0;
}
.mobile-file-info { display: flex; align-items: center; gap: .5rem; min-width: 0; }
.mobile-file-info i { color: var(--yellow-400); font-size: .875rem; flex-shrink: 0; }
#mobileCurrentFile { font-family: 'Fira Code', monospace; font-size: .75rem; font-weight: 500; color: var(--slate-200); }
.rename-mobile-btn {
  padding: .5rem; color: var(--slate-400); font-size: .75rem; min-width: 36px; min-height: 36px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.rename-mobile-btn:hover { color: var(--blue-400); }

.editor-area { flex: 1 1 0%; min-height: 0; overflow: hidden; position: relative; background: #0d1322; display: flex; flex-direction: column; }

/* ---------- Status bar ---------- */
.status-bar {
  background: var(--slate-950); padding: .375rem .75rem; border-top-width: 1px;
  font-size: 11px; color: var(--slate-500); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
.status-group { display: flex; align-items: center; gap: .5rem; }
#filePathDisplay { color: var(--slate-400); font-family: 'Fira Code', monospace; font-size: 11px; max-width: 150px; }
.status-ready { display: none; align-items: center; gap: .25rem; color: var(--emerald-400); }
.status-ready i { font-size: 9px; }
.status-btn { display: flex; align-items: center; gap: .25rem; color: var(--slate-400); transition: color .15s; }
.status-btn.rename { display: none; }
.status-btn.rename:hover { color: var(--blue-400); }
.status-btn.delete { color: var(--rose-400); }
.status-btn.delete:hover { color: #fda4af; }
.status-btn .btn-label { display: none; }
.divider { color: var(--slate-600); }
.py-version { color: var(--slate-400); font-family: 'Fira Code', monospace; }

/* ---------- Code editor ---------- */
.editor-wrapper { position: relative; width: 100%; height: 100%; display: flex; overflow: hidden; }
.line-numbers {
  user-select: none; padding: 1rem .5rem 1rem .75rem; text-align: right; color: var(--slate-600);
  background-color: #0b1120; border-right: 1px solid var(--slate-800);
  font-size: .85rem; line-height: 1.625; font-family: 'Fira Code', monospace; overflow: hidden;
}
.code-area-container { position: relative; flex: 1 1 0%; min-height: 0; overflow: hidden; }
.code-textarea, .code-highlight {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  padding: 1rem !important; line-height: 1.625 !important; font-size: .85rem !important;
  font-family: 'Fira Code', monospace !important; white-space: pre !important;
  border: none !important; margin: 0 !important;
}
.code-textarea {
  background: transparent; color: transparent; caret-color: #38bdf8; resize: none; outline: none;
  overflow: auto; tab-size: 4; z-index: 10; scroll-padding-bottom: 3rem;
}
.code-highlight { pointer-events: none; background: transparent !important; overflow: hidden; z-index: 5; display: block; }
.code-highlight code { font-family: inherit !important; font-size: inherit !important; line-height: inherit !important; padding: 0 !important; background: transparent !important; }

/* ---------- Flow node pulse ---------- */
@keyframes activePulse {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59,130,246,.7); }
  70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(59,130,246,0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59,130,246,0); }
}
.active-node { animation: activePulse 1.6s infinite; border-color: var(--blue-500) !important; background-color: rgba(30,58,138,.35) !important; }

/* ---------- Mobile drawer ---------- */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); z-index: 40; opacity: 0; transition: opacity .3s ease; }
.drawer-overlay.visible { opacity: 1; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: 80%; max-width: 20rem;
  background: var(--slate-900); border-right-width: 1px; z-index: 50;
  transform: translateX(-100%); transition: transform .3s cubic-bezier(.16,1,.3,1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head { padding: 1rem; border-bottom-width: 1px; display: flex; align-items: center; justify-content: space-between; background: var(--slate-950); }
.drawer-title { display: flex; align-items: center; gap: .5rem; color: var(--slate-200); font-weight: 600; font-size: .875rem; }
.drawer-title i { color: var(--yellow-400); }
.drawer-close { padding: .5rem; color: var(--slate-400); min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
.drawer-close:hover { color: #fff; }
.drawer-close i { font-size: 1.125rem; }
.drawer-new { padding: .75rem; border-bottom: 1px solid rgba(30,41,59,.8); }
.drawer-list { flex: 1 1 0%; overflow-y: auto; padding: .75rem; display: flex; flex-direction: column; gap: .5rem; }
.drawer-foot { padding: .75rem; border-top-width: 1px; background: var(--slate-950); text-align: center; }
.drawer-reset { color: var(--rose-400); font-size: .75rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: .375rem; width: 100%; padding: .5rem 0; }
.drawer-item {
  padding: .75rem; border-radius: .75rem; display: flex; align-items: center; justify-content: space-between;
  font-family: 'Fira Code', monospace; font-size: .75rem; cursor: pointer; transition: all .15s; min-height: 48px;
  background: var(--slate-950); color: var(--slate-300);
}
.drawer-item:hover { background: var(--slate-800); }
.drawer-item.active { background: rgba(30,58,138,.4); color: var(--blue-300); border: 1px solid rgba(29,78,216,.5); font-weight: 600; }
.drawer-item-name { display: flex; align-items: center; gap: .625rem; overflow: hidden; }
.drawer-item-name i { font-size: .875rem; }
.drawer-item .check { color: var(--blue-400); font-size: .75rem; }

/* ---------- Buttons ---------- */
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  background: var(--emerald-600); color: #fff; font-size: .75rem; font-weight: 600;
  border-radius: .5rem; padding: .625rem; min-height: 44px; transition: background .15s;
}
.btn-primary:hover { background: var(--emerald-500); }
.btn-primary.full { width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,.3); }
.btn-primary.blue { background: var(--blue-600); }
.btn-primary.blue:hover { background: var(--blue-500); }
.btn-primary.modal { border-radius: .75rem; padding: .625rem 1rem; }
.btn-outline {
  padding: .625rem 1rem; border-radius: .75rem; border: 1px solid var(--slate-700);
  font-size: .75rem; font-weight: 500; color: var(--slate-300); min-height: 44px; transition: background .15s;
}
.btn-outline:hover { background: var(--slate-800); }

/* ---------- Modals ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50;
}
.modal-box {
  background: var(--slate-900); border: 1px solid var(--slate-800); border-radius: 1rem;
  width: 100%; max-width: 28rem; padding: 1.25rem; box-shadow: 0 25px 50px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 1rem;
}
.modal-box.sm { max-width: 24rem; }
.modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--slate-800); padding-bottom: .75rem; }
.modal-head h3 { font-size: .875rem; font-weight: 600; color: var(--slate-100); display: flex; align-items: center; gap: .5rem; }
.modal-head .fa-python { color: var(--yellow-400); }
.modal-head .fa-pen-to-square { color: var(--blue-400); }
.modal-close { color: var(--slate-400); padding: .5rem; min-width: 40px; min-height: 40px; }
.modal-close:hover { color: var(--slate-200); }
.modal-fields { display: flex; flex-direction: column; gap: .75rem; }
.field-label { font-size: .75rem; color: var(--slate-400); display: block; margin-bottom: .25rem; font-weight: 500; }
.field-input {
  width: 100%; background: var(--slate-950); border: 1px solid var(--slate-800); border-radius: .75rem;
  padding: .625rem .875rem; font-size: .75rem; font-family: 'Fira Code', monospace; color: var(--slate-200); min-height: 44px;
}
textarea.field-input { padding: .75rem; min-height: 0; }
.field-input:focus { outline: none; border-color: var(--blue-500); }
.modal-actions { display: flex; justify-content: flex-end; gap: .5rem; padding-top: .5rem; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 4rem; right: 1rem; left: 1rem;
  background: var(--slate-800); border: 1px solid var(--slate-700); color: var(--slate-100);
  padding: .75rem 1rem; border-radius: .75rem; box-shadow: 0 25px 50px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  font-size: .75rem; font-weight: 500; z-index: 50;
  opacity: 0; pointer-events: none; transform: translateY(.75rem); transition: all .3s;
}
.toast.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.toast-inner { display: flex; align-items: center; gap: .5rem; }
.toast-inner i { color: var(--emerald-400); font-size: 1rem; }

.mobile-nav-btn { flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .5rem 0; color: var(--slate-400); min-height: 48px; transition: all .15s; }
.mobile-nav-btn:hover { color: var(--slate-200); }
.mobile-nav-btn.active { color: var(--blue-400); font-weight: 600; }

/* ---------- Responsive: sm (640px) ---------- */
@media (min-width: 640px) {
  .app-header { padding-left: 1rem; padding-right: 1rem; }
  .app-title { font-size: .875rem; }
  .header-left, .header-actions { gap: .75rem; }
  .header-actions { gap: .5rem; }
  .icon-btn { width: auto; height: auto; padding: .5rem .75rem; }
  .status-ready { display: flex; }
  #filePathDisplay { max-width: none; }
  .status-group + .status-group { gap: .75rem; }
  .status-btn .btn-label { display: inline; }
}

/* ---------- Responsive: md (768px) ---------- */
@media (min-width: 768px) {
  .menu-btn, .mobile-file-bar, .drawer, .drawer-overlay { display: none !important; }
  .tabs-bar { display: flex; }
  .btn-label { display: inline; }
  #mainContainer { flex-direction: row; }
  #editorPanel { width: 50%; }
  .status-btn.rename { display: flex; }
  .toast { bottom: 1.5rem; left: auto; width: auto; justify-content: flex-start; }
}
</style>
</head>
<body>

<!-- TOP HEADER -->
<header class="app-header">
  <div class="header-left">
    <button onclick="toggleMobileFileDrawer()" class="icon-btn menu-btn" title="Open Modules List"><span>&#9776;</span></button>
    <h1 class="app-title">TransLenCe</h1>
  </div>
  <div class="header-actions">
    <button onclick="copyCurrentCode()" class="icon-btn" title="Copy Current Code">
      <i class="fa-regular fa-copy"></i> <span class="btn-label">Copy</span>
    </button>
    <button onclick="resetToDefaults()" class="icon-btn danger" title="Reset modules to default">
      <i class="fa-solid fa-rotate-left"></i> <span class="btn-label">Reset</span>
    </button>
  </div>
</header>

<!-- MAIN WORKSPACE -->
<div id="mainContainer">
  <div id="editorPanel">
    <div class="tabs-bar no-scrollbar" id="tabsBar">
      <div id="tabsContainer"></div>
      <button onclick="openNewFileModal()" class="add-tab-btn" title="Create New Module"><i class="fa-solid fa-plus"></i></button>
    </div>

    <div class="mobile-file-bar">
      <div class="mobile-file-info">
        <i class="fa-brands fa-python"></i>
        <span id="mobileCurrentFile" class="truncate">circulatory_system.py</span>
      </div>
      <button onclick="openRenameFileModal()" class="rename-mobile-btn" title="Rename Module">
        <span>Rename File <i class="fa-solid fa-pen-to-square"></i></span>
      </button>
    </div>

    <div class="editor-area">
      <div class="editor-wrapper">
        <div id="lineNumbers" class="line-numbers">1</div>
        <div class="code-area-container">
          <pre class="code-highlight"><code id="codeHighlight" class="language-python"></code></pre>
          <textarea id="codeEditor" class="code-textarea font-mono" spellcheck="false" placeholder="# Write Python code here..."></textarea>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-group">
        <span id="filePathDisplay" class="truncate">./hand.py</span>
        <span class="status-ready"><i class="fa-solid fa-circle-check"></i> Ready</span>
      </div>
      <div class="status-group">
        <button onclick="openRenameFileModal()" class="status-btn rename"><i class="fa-solid fa-pen-to-square"></i> Rename</button>
        <button onclick="deleteCurrentFile()" id="deleteFileBtn" class="status-btn delete">
          <i class="fa-solid fa-trash-can"></i> <span class="btn-label">Delete</span>
        </button>
        <span class="divider">|</span>
        <span class="py-version">Python 3.11</span>
      </div>
    </div>
  </div>
</div>

<!-- MOBILE DRAWER -->
<div id="mobileDrawerOverlay" onclick="toggleMobileFileDrawer()" class="drawer-overlay hidden"></div>
<div id="mobileDrawer" class="drawer">
  <div class="drawer-head">
    <div class="drawer-title"><i class="fa-solid fa-folder-tree"></i> Module Files</div>
    <button onclick="toggleMobileFileDrawer()" class="drawer-close"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="drawer-new">
    <button onclick="toggleMobileFileDrawer(); openNewFileModal()" class="btn-primary full"><i class="fa-solid fa-plus"></i> Create New Module</button>
  </div>
  <div class="drawer-list" id="mobileDrawerFileList"></div>
  <div class="drawer-foot">
    <button onclick="resetToDefaults(); toggleMobileFileDrawer()" class="drawer-reset"><i class="fa-solid fa-rotate-left"></i> Reset Default Files</button>
  </div>
</div>

<!-- CREATE FILE MODAL -->
<div id="newFileModal" class="modal-backdrop hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fa-brands fa-python"></i> Create Python Module</h3>
      <button onclick="closeNewFileModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-fields">
      <div>
        <label class="field-label">Module Name (e.g. brain, lungs)</label>
        <input type="text" id="newFileKey" placeholder="e.g. brain" class="field-input">
      </div>
      <div>
        <label class="field-label">Initial Code</label>
        <textarea id="newFileCode" rows="4" class="field-input" placeholder="def my_func():&#10;    return 'Module initialized!'"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="closeNewFileModal()" class="btn-outline">Cancel</button>
      <button onclick="createNewFile()" class="btn-primary modal">Create File</button>
    </div>
  </div>
</div>

<!-- RENAME MODAL -->
<div id="renameFileModal" class="modal-backdrop hidden">
  <div class="modal-box sm">
    <div class="modal-head">
      <h3><i class="fa-solid fa-pen-to-square"></i> Rename Module</h3>
      <button onclick="closeRenameFileModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div>
      <label class="field-label">New Module Name</label>
      <input type="text" id="renameInputKey" placeholder="new_name" class="field-input">
    </div>
    <div class="modal-actions">
      <button onclick="closeRenameFileModal()" class="btn-outline">Cancel</button>
      <button onclick="renameCurrentFile()" class="btn-primary blue modal">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast">
  <div class="toast-inner">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMessage">Action completed successfully!</span>
  </div>
</div>

<script>
// Default Preloaded Module Code Files
const defaultFiles = {
    hand: `def arm():
    return "This is the part of the hand that excludes the fingers."

def palm():
    return "This is the part of the hand between the arm and fingers."

def human_fingers():
    return "There are 5 fingers on the standard human hand."

def thumb():
    return "The thickest digit on the human hand, opposing other fingers."

def index_finger():
    return "The first finger next to the thumb, used for pointing."

def middle_finger():
    return "The central and usually longest digit on the hand."

def ring_finger():
    return "The fourth digit, traditionally where rings are worn."

def little_finger():
    return "The smallest digit located on the outer edge of the hand."`,

    heart: `def heart():
    return "Muscular organ pumping oxygenated blood through the body."

def left_ventricle():
    return "Pumps oxygenated blood to the body via the aorta."

def right_ventricle():
    return "Pumps deoxygenated blood to the lungs."

def left_atrium():
    return "Receives oxygenated blood returning from lungs."

def right_atrium():
    return "Receives deoxygenated blood returning from body."

def major_vessels():
    return "Includes aorta, vena cava, and pulmonary arteries."`,

    blood_flow: `# blood_flow.py
import heart
import hand

def trace_blood_flow():
    """Simulates blood flow from heart down to human fingertips."""
    print("=== PATHWAY OF BLOOD: HEART TO HAND ===\\n")
    
    # Step 1: Start at Heart
    print(f"1. Left Ventricle:\\n   {heart.left_ventricle()}\\n  Blood flow to the hand begins here. Blood is pumped from here to the aorta.")
    print(f"2. Major Vessels (Aorta):\\n   {heart.major_vessels()}\\n  Blood is carrried from here to the arm.")
    
    # Step 2: Travel down Arm
    print(f"3. Arm:\\n   {hand.arm()}\\n  The arm is the initial part of the hand that receive sblood from the heart.")
    print(f"4. Palm:\\n   {hand.palm()}\\n  The palm is the part of the hand between the arm and fingers. Blood flows from the arm to the palm.")
    
    # Step 3: Supply Fingers
    print("5. Finger Destinations:")
    print("Blood is distributed to the fingers from the palm.")
    print(f"   {hand.human_fingers()}\\n)")
    print(f" • Thumb: {hand.thumb()}")
    print(f" • Index: {hand.index_finger()}")
    print(f" • Middle: {hand.middle_finger()}")
    print(f" • Ring: {hand.ring_finger()}")
    print(f" • Little: {hand.little_finger()}")

if __name__ == "__main__":
    trace_blood_flow()`,

    result: ` # This is how your results would look after excuting the codes succesfully.
       === PATHWAY OF BLOOD: HEART TO HAND ===

            1. Left Ventricle:
            This thick, muscular lower chamber pumps oxygen-rich blood to the entire body through the aorta.
 
            2. Major Vessels (Aorta & Subclavian Artery):
            These include the aorta, superior/inferior vena cava, pulmonary arteries, and pulmonary veins.

            3. Arm:
            This is the part of the hand that excludes the fingers and hand.

            4. Palm:
            This is the part of the hand between the arm and fingers.

            5. Human Fingers Overview:
            There are generally 5 fingers on the human hand. Abnormal conditions could result
            in the number of fingers decreasing or increasing. The 5 fingers are: little finger,
            ring finger, middle finger, index finger and the thumb.

            --- Specific Finger Destinations ---
            • Thumb: This is the largest finger in size at the other extreme of the hand.
            • Index Finger: This finger is next to the thumb and usually used for pointing.
            • Middle Finger: As the name is, this finger lies in the middle and usually the tallest.
            • Ring Finger: This finger is next to the finger next to the little finger. Rings are out on this finger.
            • Little Finger: This is the smallest finger at the extreme of the hand.
    `
};

// Application State
let codeFiles = { ...defaultFiles };
let currentTab = 'hand';
let currentMobileView = 'editor';
let isSimulating = false;

// DOM Element Cache
const editor = document.getElementById('codeEditor');
const codeHighlight = document.getElementById('codeHighlight');
const lineNumbers = document.getElementById('lineNumbers');

// Icon colour class by file name
function iconClass(key) {
    return key.includes('heart') ? 'ico-heart' : key.includes('hand') ? 'ico-hand' : 'ico-default';
}

window.addEventListener('DOMContentLoaded', () => {
    renderTabs();
    renderMobileDrawerFiles();
    switchTab('hand');
    setupEditorSync();
    handleResize();
    window.addEventListener('resize', handleResize);
});

editor.addEventListener('scroll', () => {
    codeHighlight.scrollTop = editor.scrollTop;
    codeHighlight.scrollLeft = editor.scrollLeft;
    if (lineNumbers) lineNumbers.scrollTop = editor.scrollTop;
});

function handleResize() {
    if (window.innerWidth >= 768) {
        document.getElementById('editorPanel').classList.remove('hidden');
        document.getElementById('outputPanel').classList.remove('hidden');
    } else {
        switchMobileTab(currentMobileView);
    }
}

function setupEditorSync() {
    editor.addEventListener('input', () => {
        codeFiles[currentTab] = editor.value;
        updateHighlightAndLines();
    });

    editor.addEventListener('scroll', () => {
        const highlightPre = codeHighlight.parentElement;
        highlightPre.scrollTop = editor.scrollTop;
        highlightPre.scrollLeft = editor.scrollLeft;
        lineNumbers.scrollTop = editor.scrollTop;
    });

    editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + "    " + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = start + 4;
            codeFiles[currentTab] = editor.value;
            updateHighlightAndLines();
        }
    });
}

function updateHighlightAndLines() {
    const rawCode = editor.value;
    codeHighlight.textContent = rawCode;
    Prism.highlightElement(codeHighlight);

    const linesCount = rawCode.split('\n').length;
    let lineStr = '';
    for (let i = 1; i <= linesCount; i++) lineStr += `${i}\n`;
    lineNumbers.innerText = lineStr;
}

function renderTabs() {
    const container = document.getElementById('tabsContainer');
    container.innerHTML = '';

    Object.keys(codeFiles).forEach(key => {
        const isActive = key === currentTab;
        const tabBtn = document.createElement('button');
        const fileName = key.endsWith('.py') ? key : `${key}.py`;

        tabBtn.className = `tab-btn${isActive ? ' active' : ''}`;
        tabBtn.onclick = () => switchTab(key);
        tabBtn.innerHTML = `
            <i class="fa-brands fa-python ${iconClass(key)}"></i>
            <span>${fileName}</span>
        `;
        container.appendChild(tabBtn);
    });
}

function renderMobileDrawerFiles() {
    const list = document.getElementById('mobileDrawerFileList');
    list.innerHTML = '';

    Object.keys(codeFiles).forEach(key => {
        const isActive = key === currentTab;
        const fileName = key.endsWith('.py') ? key : `${key}.py`;

        const item = document.createElement('div');
        item.className = `drawer-item${isActive ? ' active' : ''}`;
        item.onclick = () => {
            switchTab(key);
            toggleMobileFileDrawer();
        };

        item.innerHTML = `
            <div class="drawer-item-name">
                <i class="fa-brands fa-python ${iconClass(key)}"></i>
                <span class="truncate">${fileName}</span>
            </div>
            ${isActive ? '<i class="fa-solid fa-check check"></i>' : ''}
        `;
        list.appendChild(item);
    });
}

function switchTab(tabKey) {
    currentTab = tabKey;
    renderTabs();
    renderMobileDrawerFiles();

    const fileName = tabKey.endsWith('.py') ? tabKey : `${tabKey}.py`;
    document.getElementById('filePathDisplay').textContent = `./${fileName}`;
    document.getElementById('mobileCurrentFile').textContent = fileName;

    editor.value = codeFiles[tabKey] || '';
    updateHighlightAndLines();
}

function switchMobileTab(mode) {
    currentMobileView = mode;
    if (window.innerWidth >= 768) return;

    const editorPanel = document.getElementById('editorPanel');
    const outputPanel = document.getElementById('outputPanel');
    const navEditor = document.getElementById('mobile-nav-editor');

    [navEditor].forEach(btn => btn.className = 'mobile-nav-btn');

    if (mode === 'editor') {
        editorPanel.classList.remove('hidden');
        outputPanel.classList.add('hidden');
        navEditor.className = 'mobile-nav-btn active';
    } else if (mode === 'terminal') {
        editorPanel.classList.add('hidden');
        outputPanel.classList.remove('hidden');
    }
}

function switchOutputMode(mode) {}

function toggleMobileFileDrawer() {
    const drawer = document.getElementById('mobileDrawer');
    const overlay = document.getElementById('mobileDrawerOverlay');

    if (!drawer.classList.contains('open')) {
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.add('visible'), 10);
        drawer.classList.add('open');
    } else {
        overlay.classList.remove('visible');
        drawer.classList.remove('open');
        setTimeout(() => overlay.classList.add('hidden'), 300);
    }
}

function openNewFileModal() {
    document.getElementById('newFileModal').classList.remove('hidden');
    document.getElementById('newFileKey').focus();
}

function closeNewFileModal() {
    document.getElementById('newFileModal').classList.add('hidden');
    document.getElementById('newFileKey').value = '';
    document.getElementById('newFileCode').value = '';
}

function createNewFile() {
    let key = document.getElementById('newFileKey').value.trim().toLowerCase();
    const code = document.getElementById('newFileCode').value || `# ${key}.py\n\ndef main():\n    return "Module loaded!"`;

    if (!key) {
        showToast("Please enter a valid module name!", "error");
        return;
    }

    key = key.replace(/\.py$/, '');

    if (codeFiles[key]) {
        showToast("Module already exists!", "error");
        return;
    }

    codeFiles[key] = code;
    closeNewFileModal();
    switchTab(key);
    renderNodes();
    showToast(`Created ${key}.py`);
}

function openRenameFileModal() {
    document.getElementById('renameFileModal').classList.remove('hidden');
    const input = document.getElementById('renameInputKey');
    input.value = currentTab;
    input.focus();
}

function closeRenameFileModal() {
    document.getElementById('renameFileModal').classList.add('hidden');
}

function renameCurrentFile() {
    let newKey = document.getElementById('renameInputKey').value.trim().toLowerCase();
    if (!newKey) return;
    newKey = newKey.replace(/\.py$/, '');

    if (newKey === currentTab) {
        closeRenameFileModal();
        return;
    }

    if (codeFiles[newKey]) {
        showToast("Module name already exists!", "error");
        return;
    }

    const codeContent = codeFiles[currentTab];
    delete codeFiles[currentTab];
    codeFiles[newKey] = codeContent;

    closeRenameFileModal();
    switchTab(newKey);
    renderNodes();
    showToast(`Renamed module to ${newKey}.py`);
}

function deleteCurrentFile() {
    const keys = Object.keys(codeFiles);
    if (keys.length <= 1) {
        showToast("Cannot delete the only remaining file!", "error");
        return;
    }

    const deletedName = currentTab;
    delete codeFiles[currentTab];
    const nextTab = Object.keys(codeFiles)[0];
    switchTab(nextTab);
    renderNodes();
    showToast(`Deleted ${deletedName}.py`);
}

function resetToDefaults() {
    codeFiles = { ...defaultFiles };
    switchTab('circulatory_system');
    renderNodes();
    showToast("Reset to default modules");
}

async function runSimulation() {
    if (isSimulating) return;
    isSimulating = true;

    if (window.innerWidth < 768) {
        switchMobileTab('terminal');
    } else {
        switchOutputMode('terminal');
    }

    const appendLog = (text, classNames = "log-default") => {
        const div = document.createElement('div');
        div.className = classNames;
        div.textContent = text;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    };

    const delay = (ms) => new Promise(res => setTimeout(res, ms));

    const keys = Object.keys(codeFiles);
    const activeIndex = keys.indexOf(currentTab);
    highlightNode(activeIndex + 1);

    const lines = codeFiles[currentTab].split('\n');
    await delay(350);

    let printed = false;

    for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('print(')) {
            let content = trimmed.slice(6, -1).replace(/^["']|["']$/g, '');
            content = content.replace(/\\n/g, '\n');
            appendLog(content, "log-print");
            printed = true;
            await delay(250);
        } else if (trimmed.startsWith('def ')) {
            appendLog(`[DEF] Function '${trimmed.split('(')[0].replace('def ', '')}' loaded`, "log-def");
        }
    }

    if (!printed) {
        appendLog(`Found ${lines.filter(l => l.trim().startsWith('def ')).length} function definitions.`, "log-muted");
    }

    appendLog(`\nProcess finished with exit code 0`, "log-done");
    isSimulating = false;
}

function highlightNode(stepNum) {
    document.querySelectorAll('.node-card').forEach(card => card.classList.remove('active-node'));
    const activeNode = document.getElementById(`node-${stepNum}`);
    if (activeNode) activeNode.classList.add('active-node');
}

function clearTerminal() {
    const consoleEl = document.getElementById('terminalConsole');
    consoleEl.innerHTML = `<div class="log-prompt">$ python script.py</div>`;
}

function copyCurrentCode() {
    const codeToCopy = codeFiles[currentTab];

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(codeToCopy);
    } else {
        const textArea = document.createElement("textarea");
        textArea.value = codeToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
    }

    showToast(`Copied ${currentTab}.py to clipboard`);
}

function showToast(msg, type = "success") {
    const toast = document.getElementById('toast');
    document.getElementById('toastMessage').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
